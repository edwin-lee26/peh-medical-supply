<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — PEH Medical Supply</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

  <header class="site-header" id="siteHeader"></header>

  <main class="container page-main">

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      <strong id="breadcrumbCurrent">Products</strong>
    </nav>

    <div class="page-head">
      <div>
        <h1 id="pageTitle">Products</h1>
        <div class="sub" id="pageSubtitle"></div>
      </div>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Home
      </a>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" id="productSearch" placeholder="Search within this list…" aria-label="Search products in this category">
      </div>
      <span id="resultCount" class="badge badge--plain">0 products</span>
    </div>

    <div class="product-grid" id="productGrid"></div>

  </main>

  <footer class="site-footer">
    <p><strong>PEH Medical Supply</strong> — Internal Hospital/Clinic Supply Ordering System · Demo build, no backend required</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
